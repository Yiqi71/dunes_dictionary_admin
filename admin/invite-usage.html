<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证码使用情况</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #191d24;
      --line: #2e3440;
      --text: #eef2f8;
      --muted: #9ca7b8;
      --danger: #e24a4a;
      --box-empty: #0f1218;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #1f2631 0%, var(--bg) 48%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.4px;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .card {
      background: rgba(25, 29, 36, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .head, .row {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
    }
    .head {
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }
    .row {
      border-bottom: 1px solid rgba(46, 52, 64, 0.7);
    }
    .row:last-child {
      border-bottom: 0;
    }
    .code {
      font-size: 15px;
      letter-spacing: 0.6px;
      word-break: break-all;
    }
    .boxes {
      display: inline-flex;
      gap: 6px;
    }
    .usage-text {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .box {
      width: 16px;
      height: 16px;
      border: 1px solid #4a5568;
      border-radius: 3px;
      background: var(--box-empty);
    }
    .box.filled {
      background: var(--danger);
      border-color: var(--danger);
    }
    .summary {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .status {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 560px) {
      .head, .row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1>验证码使用情况</h1>
      <a class="back-link" href="../index.html">返回首页</a>
    </div>
    <section class="card">
      <div class="head">
        <div>验证码</div>
        <div>使用槽位（5格）</div>
      </div>
      <div id="rows"></div>
    </section>
    <p id="summary" class="summary"></p>
    <p id="status" class="status">加载中...</p>
  </main>

  <script>
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://localhost:3000"
      : "https://api.dunes-dictionary.com";

    function buildBoxes(usedCount, maxDevices) {
      const boxes = document.createElement("div");
      boxes.className = "boxes";
      for (let i = 0; i < maxDevices; i++) {
        const box = document.createElement("span");
        box.className = i < usedCount ? "box filled" : "box";
        boxes.appendChild(box);
      }
      return boxes;
    }

    function renderRows(items) {
      const rowsEl = document.getElementById("rows");
      rowsEl.innerHTML = "";

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "row";

        const code = document.createElement("div");
        code.className = "code";
        code.textContent = item.code;

        const boundCount = Math.max(0, Number(item.boundCount) || 0);
        const isUnlimited = Boolean(item.isUnlimited) || String(item.deviceLimitMode || "").toLowerCase() === "unlimited";
        let usageNode;
        if (isUnlimited) {
          const usageText = document.createElement("div");
          usageText.className = "usage-text";
          usageText.textContent = `${boundCount} / unlimited`;
          usageNode = usageText;
        } else {
          const maxDevices = Math.max(1, Number(item.maxDevices) || 5);
          const usedCount = Math.min(maxDevices, boundCount);
          const boxes = buildBoxes(usedCount, maxDevices);
          boxes.title = `${usedCount}/${maxDevices}`;
          usageNode = boxes;
        }

        row.appendChild(code);
        row.appendChild(usageNode);
        rowsEl.appendChild(row);
      }
    }

    async function loadInviteUsage() {
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      statusEl.textContent = "加载中...";

      try {
        const res = await fetch(`${API_BASE}/api/invite/usage`);
        const payload = await res.json();
        if (!res.ok || !payload || payload.ok !== true || !Array.isArray(payload.items)) {
          throw new Error((payload && payload.error) ? payload.error : "request_failed");
        }

        renderRows(payload.items);
        const usedAny = payload.items.filter((item) => (Number(item.boundCount) || 0) > 0).length;
        summaryEl.textContent = `共 ${payload.items.length} 个验证码，已使用 ${usedAny} 个。`;
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = `加载失败：${err.message || "unknown_error"}`;
      }
    }

    loadInviteUsage();
  </script>
</body>
</html>
